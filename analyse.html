<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerGrid | Analyse</title>
    <link rel="icon" href="../assets/powergrid-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../css/analyse.css">
    <link rel="stylesheet" href="../css/branding.css">
</head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">
          <img class="powergrid-brand-mark" src="../assets/powergrid-mark.svg" alt="" />
          <div><strong>PowerGrid</strong></div>
        </div>
        <nav class="nav" aria-label="Workflow navigation">
          <a href="home.html">Home</a>
          <a href="report-outage.html">Report</a>
          <a href="verify-deduplicate.html">Verify</a>
          <a href="prioritise.html">Prioritise</a>
          <a href="dispatch.html">Dispatch</a>
          <a href="assign-technician.html">Assign</a>
          <a href="track.html">Track</a>
          <a href="repair.html">Repair</a>
          <a href="notify-customer.html">Notify</a>
          <a href="close.html">Close</a>
          <a href="analyse.html">Analyse</a>
        </nav>
      </header>

      <main class="page">
        <section class="header-card">
          <span class="eyebrow">Step 10</span>
          <h1>Analyse</h1>
          <p class="subtitle">Review incident performance, identify root causes, and guide preventative actions for the next outage event.</p>
        </section>

        <section class="content">
          <div class="panel">
            <div class="chart">
              <div class="bar" style="height: 42%;"></div>
              <div class="bar" style="height: 68%;"></div>
              <div class="bar" style="height: 82%;"></div>
              <div class="bar" style="height: 56%;"></div>
              <div class="bar" style="height: 90%;"></div>
            </div>
          </div>

          <aside class="panel">
            <div class="stats">
              <div class="stat"><div class="label">MTTR</div><div class="value">2.4h</div></div>
              <div class="stat"><div class="label">Escalations</div><div class="value">3</div></div>
              <div class="stat"><div class="label">Preventive actions</div><div class="value">5</div></div>
            </div>
          </aside>
        </section>

        <div class="step-links">
          <a class="btn secondary" href="home.html">Return home</a>
        </div>
      </main>
    </div>
  </body>
