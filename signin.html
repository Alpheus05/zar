<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>PowerGrid | Resident Sign In</title><link rel="icon" href="../assets/powergrid-icon.svg" type="image/svg+xml" /><link rel="stylesheet" href="../css/app.css" /><link rel="stylesheet" href="../css/branding.css" /></head>
  <body>
    <main class="auth-page">
      <section class="auth-brand" aria-label="PowerGrid overview">
        <img class="powergrid-full-logo" src="../assets/powergrid-logo-light.svg" alt="PowerGrid" />
        <div class="auth-copy">
          <h1>Report outages.<br>Keep Tshwane powered.</h1>
          <p>A faster, smarter way to report and track electricity outages.</p>
          <div class="value-points">
            <div class="value-point"><span class="value-icon">◷</span>Report in minutes</div>
            <div class="value-point"><span class="value-icon">⌖</span>Track your outage</div>
            <div class="value-point"><span class="value-icon">✓</span>Get real updates</div>
          </div>
        </div>
      </section>
      <section class="auth-form-side">
        <div class="card auth-card">
          <h2>Welcome back</h2><p>Sign in to your resident account.</p>
          <form id="loginForm">
            <div class="auth-fields">
              <div><label class="form-label" for="email">Email address</label><input class="field" id="email" type="email" placeholder="you@example.com" required /></div>
              <div><label class="form-label" for="password">Password</label><input class="field" id="password" type="password" placeholder="Enter your password" required /></div>
            </div>
            <div class="auth-row"><label><input type="checkbox" id="rememberMe" /> Remember me</label><a class="auth-link" href="#">Forgot password?</a></div>
            <button class="btn btn-primary" type="submit">Sign in</button>
            <div class="status-box" id="loginStatus" aria-live="polite"></div>
            <div class="auth-footer">Don’t have an account? <a class="auth-link" href="create-account.html">Create account</a><br><br><a class="auth-link" href="admin-signin.html">Administrator access</a></div>
          </form>
        </div>
      </section>
    </main>
    <script src="../js/signin.js"></script>
  </body>
</html>
